name: Deploy

# Build, test, and deploy to Cloudflare Workers on every push to main.
# Free on GitHub Actions. Requires two repo secrets (Settings → Secrets and
# variables → Actions): CLOUDFLARE_API_TOKEN (Sally's scoped token — see README)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test # builds + smoke tests; a red build blocks the deploy
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
